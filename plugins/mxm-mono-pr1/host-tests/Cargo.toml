[package]
name = "mxm-mono-pr1-host-tests"
description = "mxm-mono-pr1 hosted by MXM Player: behaviour and golden audio and robustness through the real host, against its release bundle. The slow tier: `cargo test -p mxm-mono-pr1` never builds the player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# The tests are in `tests/`; the library is empty and not test-built.
test = false
doctest = false

[dev-dependencies]
mxm-player.workspace = true
mxm-player-harness.workspace = true
clack-extensions = { version = "=0.1.1", default-features = false, features = ["clack-host"] }
clack-host = "=0.1.1"
mxm-measure.workspace = true
